services:
  postgresql: 
    image: postgres:16
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "test"
      POSTGRES_PASSWORD: "12345678"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
  redis:
    image: redis:latest
    ports:
      - "6379:6379"