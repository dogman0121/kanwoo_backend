[project]
name = "kanwoo"
version = "0.1.0"
description = ""
authors = [
    {name = "dogman0121",email = "giachetti101@gmail.com"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "flask (>=3.1.2,<4.0.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "flask-migrate (>=4.1.0,<5.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "flask-jwt-extended (>=4.7.1,<5.0.0)",
    "flask-cors (>=6.0.1,<7.0.0)",
    "flask-mail (>=0.10.0,<0.11.0)",
    "pillow (>=12.0.0,<13.0.0)",
    "marshmallow (>=4.1.0,<5.0.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "pytils (>=0.4.4,<0.5.0)",
    "flask-limiter (>=4.1.0,<5.0.0)",
    "rich (>=14.2.0,<15.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "dependency-injector (>=4.48.3,<5.0.0)",
    "gunicorn (>=25.1.0,<26.0.0)",
    "redis (>=7.3.0,<8.0.0)",
    "requests (>=2.34.2,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
test = "scripts.test:main"
dev = "scripts.dev:main"