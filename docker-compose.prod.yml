services:
  kanwoo-backend:
    container_name: kanwoo-backend
    image: "cr.yandex/$CR_REGISTRY/$CR_REPOSITORY:kanwoo-backend-$IMAGE_TAG"
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - /home/github/kanwoo-backend/.env
    volumes:
      - /var/storage/uploads/:/app/kanwoo/static/
      - /var/log/kanwoo-backend/:/app/kanwoo/logs/
  redis:
      image: redis:latest
      ports:
        - "6379:6379"