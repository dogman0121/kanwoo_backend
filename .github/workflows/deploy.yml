on:
    workflow_call:
        inputs:
            environment:
                required: true
                type: string
                description: What environment use to deploy
            image-tag:
                required: true
                type: string


jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}
        steps:
        - name: Clone repo
          uses: actions/checkout@v3

        - name: Get Yandex Cloud IAM token
          id: get-iam-token
          uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
          with:
            yc-sa-id: ${{ secrets.yc-sa-id }}

        - name: Execute remote SSH commands using password
          uses: appleboy/scp-action@v1
          with:
            host: ${{ secrets.ssh-host }}
            username: ${{ secrets.ssh-user }}
            key: ${{ secrets.ssh-key }}
            port: ${{ secrets.ssh-port }}
            source: ${{ vars.compose-folder-path }}/${{ vars.compose-filename }}
            target: ${{ vars.compose-destination-path }}
            debug: true

        - name: 123
          env:
            PROJECT_NAME: ${{ vars.project-name}}
            DOCKER_COMPOSE_FILENAME: ${{ vars.compose-filename }}
          run: |
            echo ${{ env.PROJECT_NAME }}
            echo ${{ env.DOCKER_COMPOSE_FILENAME }}
            echo "docker compose -f $DOCKER_COMPOSE_FILENAME -p $PROJECT_NAME down"
            echo "docker compose -f $DOCKER_COMPOSE_FILENAME -p $PROJECT_NAME up -d"

        - name: Start project
          uses: appleboy/ssh-action@v1
          env:
            YC_IAM_TOKEN: ${{ steps.get-iam-token.outputs.token }}
            CR_REGISTRY: ${{ vars.cr-registry }} 
            CR_REPOSITORY: ${{ vars.cr-repository }}
            IMAGE_TAG: ${{ inputs.image-tag }}
            DOCKER_COMPOSE_PATH: ${{ vars.compose-destination-path }}
            DOCKER_COMPOSE_FILENAME: ${{ vars.compose-filename }}
            SECRET_KEY: ${{ secrets.secret-key }}
            DATABASE_URI: ${{ secrets.database-uri }}
            CACHE_URI: ${{ secrets.cache-uri }}
            MAIL_SERVER: ${{ secrets.mail-server }}
            MAIL_PORT: ${{ secrets.mail-port }}
            MAIL_USERNAME: ${{ secrets.mail-username }}
            MAIL_PASSWORD: ${{ secrets.mail-password}}
            MAIL_DEFAULT_SENDER: ${{ vars.mail-default-sender }}
            UPLOAD_DIR: ${{ vars.upload-dir }}
            LOG_DIR: ${{ vars.log-dir }}
            CDN_URL: ${{ vars.cdn-url }}
            DOMAIN: ${{ vars.domain }}
            FRONTEND_URL: ${{ vars.frontend-url }}
            PORT: ${{ vars.port }}
            PROJECT_NAME: ${{ vars.project-name}}
          with:
            host: ${{ secrets.ssh-host }}
            username: ${{ secrets.ssh-user }}
            key: ${{ secrets.ssh-key }}
            port: ${{ secrets.ssh-port }}
            envs: 
                YC_IAM_TOKEN, 
                CR_REGISTRY, 
                CR_REPOSITORY, 
                IMAGE_TAG,   
                SECRET_KEY,
                DATABASE_URI,
                CACHE_URI,
                MAIL_SERVER,
                MAIL_PORT,
                MAIL_USERNAME,
                MAIL_DEFAULT_SENDER,
                MAIL_PASSWORD,
                UPLOAD_DIR,
                LOG_DIR,
                CDN_URL,
                DOMAIN,
                FRONTEND_URL,
                DOCKER_COMPOSE_PATH,
                DOCKER_COMPOSE_FILENAME,
                PORT,
                PROJECT_NAME
            script: |
                echo $YC_IAM_TOKEN|docker login \
                --username iam \
                --password-stdin \
                cr.yandex

                docker pull cr.yandex/$CR_REGISTRY/$CR_REPOSITORY:$IMAGE_TAG

                cd $DOCKER_COMPOSE_PATH

                docker compose -f $DOCKER_COMPOSE_FILENAME -p $PROJECT_NAME down

                docker compose -f $DOCKER_COMPOSE_FILENAME -p $PROJECT_NAME up -d

                docker image prune -a -f