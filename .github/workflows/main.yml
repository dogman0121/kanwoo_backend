on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  CR_REGISTRY: crpshkloi090v6jobv3r
  CR_REPOSITORY: kanwoo
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      
      - name: Install python
        uses: actions/setup-python@v5
      
      - name: Install poetry
        uses: abatilo/actions-poetry@v3

      - name: Clone repo
        uses: actions/checkout@v3

      - name: Install modules
        run: poetry install --no-root

      - name: Test python
        run: poetry run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v3

      - name: Login to yandex cloud registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-id: ${{ secrets.YC_SA_ID }}
          
      - name: Build, tag, and push image to Yandex Cloud Container Registry
        run: |
          docker build -t cr.yandex/$CR_REGISTRY/$CR_REPOSITORY:$IMAGE_TAG .
          docker push cr.yandex/$CR_REGISTRY/$CR_REPOSITORY:$IMAGE_TAG

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Clone repo
        uses: actions/checkout@v3

      - name: Get Yandex Cloud IAM token
        id: get-iam-token
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ secrets.YC_SA_ID }}

      - name: Execute remote SSH commands using password
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: docker-compose.yml
          target: /home/github/kanwoo
      
      - name: Start project
        uses: appleboy/ssh-action@v1
        env:
          YC_IAM_TOKEN: ${{steps.get-iam-token.outputs.token}}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: CR_REGISTRY, CR_REPOSITORY, IMAGE_TAG, YC_IAM_TOKEN
          script: |
            echo $YC_IAM_TOKEN|docker login \
              --username iam \
              --password-stdin \
            cr.yandex

            docker pull cr.yandex/$CR_REGISTRY/$CR_REPOSITORY:$IMAGE_TAG

            cd /home/github/kanwoo
            
            docker compose down

            docker compose up -d

            docker image prune -a -f