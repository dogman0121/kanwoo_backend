on:
    workflow_call:
        inputs:
            image-tag:
                required: true
                type: string
                description: Tag for docker image

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Show OIDC claims
              run: |
                  TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/dogman0121" | jq -r .value)
                  PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
                  echo "$PAYLOAD===" | base64 -d 2>/dev/null | jq '{iss, sub, aud}'
            - name: Clone repo
              uses: actions/checkout@v3

            - name: Login to yandex cloud registry
              uses: yc-actions/yc-cr-login@v3
              with:
                yc-sa-id: ${{ secrets.YC_SA_ID}}
                
            - name: Build, tag, and push image to Yandex Cloud Container Registry
              env:
                CR_REGISTRY: ${{ vars.CR_REGISTRY }}
                CR_REPOSITORY: ${{ vars.CR_REPOSITORY }}
                IMAGE_TAG: ${{ inputs.image-tag }}
              run: |
                docker build -t cr.yandex/$CR_REGISTRY/$CR_REPOSITORY:$IMAGE_TAG .
                docker push cr.yandex/$CR_REGISTRY/$CR_REPOSITORY:$IMAGE_TAG 
